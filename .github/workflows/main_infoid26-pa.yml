# ZIP deployment: https://learn.microsoft.com/azure/app-service/deploy-zip
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - infoid26-pa

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js version
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run check
          npm run build:editors

      - name: Package application
        run: |
          zip -qr "$RUNNER_TEMP/pa-app.zip" index.html site scripts package.json package-lock.json node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7.0.2
        with:
          name: node-app
          path: ${{ runner.temp }}/pa-app.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8.0.2
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8B144BEBFACC4E8E8D82EE8FB88E07B4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_417E16D0354E422F91440B3A08ABD169 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DF31FCE19ABD43E4B6D60B57C321B23A }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        run: |
          az webapp deploy \
            --resource-group infoid_group \
            --name infoid26-pa \
            --src-path pa-app.zip \
            --type zip \
            --restart true \
            --track-status true
